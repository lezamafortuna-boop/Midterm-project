<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Quick Notes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="./css/styles.css?v=2" />
    <script src="./js/takingApp.js" defer></script>
</head>

<body>
    <header>
        <h1>Quick Notes</h1>
        <div>
            <button class="add-note-btn" onClick="openNoteDialog()">+ Add Note</button>
            <button id="themeToggleBtn" class="theme-toggle-btn">🌙</button>
            <button id="logoutBtn" class="logout-btn" onclick="location.href='/auth/logout'">Logout</button>
        </div>
    </header>

    <main id="notesContainer" class="notes-grid">
        <!-- Notes dynamically rendered here -->
    </main>

    <!-- ========================= -->
    <!-- NOTE DIALOG -->
    <!-- ========================= -->
    <dialog id="noteDialog">

        <div class="dialog-content">

            <!-- Header -->
            <div class="dialog-header">
                <h2 class="dialog-title" id="dialogTitle">Add New Note</h2>
                <button class="close-btn" onClick="closeNoteDialog()">X</button>
            </div>

            <!-- COLOR SECTION -->
            <div class="color-section">
                <label for="noteColor">Note Color</label>

                <input type="color" id="noteColor" value="#ffffff" class="color-picker">

                <div class="color-palette">
                    <div class="color-swatch" data-color="#FFF4B3" style="background:#FFF4B3"></div>
                    <div class="color-swatch" data-color="#FFD6C4" style="background:#FFD6C4"></div>
                    <div class="color-swatch" data-color="#D9F7E3" style="background:#D9F7E3"></div>
                    <div class="color-swatch" data-color="#D7ECFF" style="background:#D7ECFF"></div>
                    <div class="color-swatch" data-color="#E7D9FF" style="background:#E7D9FF"></div>
                    <div class="color-swatch" data-color="#F7D9E8" style="background:#F7D9E8"></div>
                    <div class="color-swatch" data-color="#F0F0F0" style="background:#F0F0F0"></div>
                    <div class="color-swatch" data-color="#2C2F38" style="background:#2C2F38"></div>
                </div>
            </div>

            <!-- FORM -->
            <form id="noteForm">

                <div class="form-group">
                    <label for="noteTitle" class="form-label">Title</label>
                    <input type="text" id="noteTitle" class="form-input" placeholder="Enter note title" required />
                </div>

                <div class="form-group">
                    <label for="noteContent" class="form-label">Content</label>
                    <textarea id="noteContent" class="form-textarea" placeholder="Write your note here..." required></textarea>
                </div>

                <div class="dialog-actions">
                    <button type="button" class="cancel-btn" onClick="closeNoteDialog()">Cancel</button>
                    <button type="submit" class="save-btn">Save Note</button>
                </div>

            </form>
        </div>
    </dialog>

</body>
</html>
