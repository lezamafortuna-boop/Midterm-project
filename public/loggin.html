<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Quick Notes</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="/js/loggin.js" defer></script>
</head>
<body>
  <main class="auth-container">
    <!-- User Selection Screen -->
    <div id="userSelectionScreen" class="auth-screen">
      <h1>Quick Notes — Select User</h1>
      <div id="userButtons" class="user-buttons-grid"></div>
      <button id="registerBtn" class="register-btn">Register New User</button>
      <div id="message" role="status"></div>
    </div>

    <!-- Password Entry Screen -->
    <div id="passwordScreen" class="auth-screen" style="display: none;">
      <h1>Quick Notes — Login</h1>
      <div class="selected-user-info">
        <p>User: <strong id="selectedUsername"></strong></p>
        <button id="backBtn" class="back-btn">← Back</button>
      </div>
      <form id="authForm" method="post">
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required autofocus />
        </div>
        <button class="loggin-btn" type="submit">Login</button>
      </form>
      <div id="passwordMessage" role="status"></div>
    </div>

    <!-- Registration Screen -->
    <div id="registrationScreen" class="auth-screen" style="display: none;">
      <h1>Quick Notes — Register</h1>
      <button id="registrationBackBtn" class="back-btn">← Back</button>
      <form id="registrationForm" method="post">
        <div class="form-group">
          <label for="newUsername">Username</label>
          <input id="newUsername" name="username" required autofocus />
        </div>
        <div class="form-group">
          <label for="newPassword">Password</label>
          <input id="newPassword" name="password" type="password" required />
        </div>
        <button class="loggin-btn" type="submit">Register</button>
      </form>
      <div id="registrationMessage" role="status"></div>
    </div>
  </main>
</body>
</html>
